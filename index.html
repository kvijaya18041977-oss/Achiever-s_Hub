<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#3157d5">

    <title>ACHIEVERS HUB</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="top-header">

        <div class="logo">
            🎓
        </div>

        <div>
            <h1>ACHIEVERS HUB</h1>
            <p>Learn • Practise • Achieve</p>
        </div>

    </header>


    <!-- MAIN APP -->
    <main>

        <!-- HOME -->
        <section id="homePage" class="page">

            <div class="welcome-card">

                <h2>Welcome 👋</h2>

                <p>
                    Your learning journey starts here!
                </p>

            </div>


            <div class="menu-grid">

                <button class="menu-card"
                        onclick="showClasses()">

                    <span>📚</span>

                    <strong>Classes 1–12</strong>

                    <small>
                        Learn your subjects
                    </small>

                </button>


                <button class="menu-card"
                        onclick="showQuiz()">

                    <span>📝</span>

                    <strong>Quizzes</strong>

                    <small>
                        Test your knowledge
                    </small>

                </button>


                <button class="menu-card"
                        onclick="showMaterials()">

                    <span>📖</span>

                    <strong>Study Materials</strong>

                    <small>
                        Notes and resources
                    </small>

                </button>


                <button class="menu-card"
                        onclick="showProgress()">

                    <span>🏆</span>

                    <strong>My Progress</strong>

                    <small>
                        View your points
                    </small>

                </button>

            </div>

        </section>


        <!-- DYNAMIC CONTENT -->
        <section id="appContent"></section>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 ACHIEVERS HUB
        </p>

        <p>
            Learn • Practise • Achieve
        </p>

    </footer>


<script src="curriculum.js"></script>
<script src="script.js"></script>

</body>
    </html>
