<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ACHIEVERS HUB - Learn, Practise and Achieve"
    >

    <meta
        name="theme-color"
        content="#3157d5"
    >

    <title>ACHIEVERS HUB</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- HEADER -->

    <header class="top-header">

        <div class="logo">
            🎓
        </div>

        <div class="header-text">

            <h1>
                ACHIEVERS HUB
            </h1>

            <p>
                Learn • Practise • Achieve
            </p>

        </div>

    </header>


    <!-- MAIN CONTENT -->

    <main>

        <!-- HOME PAGE -->

        <section
            id="homePage"
            class="page"
        >

            <!-- WELCOME -->

            <div class="welcome-card">

                <h2>
                    Welcome to ACHIEVERS HUB 👋
                </h2>

                <p>
                    Your learning journey starts here!
                </p>

                <p>
                    📚 Learn • ✏️ Practise • 🏆 Achieve
                </p>

            </div>


            <!-- MENU -->

            <div class="menu-grid">

                <button
                    class="menu-card"
                    onclick="showClasses()"
                >

                    <span class="menu-icon">
                        📚
                    </span>

                    <strong>
                        Classes 1–12
                    </strong>

                    <small>
                        Learn your subjects
                    </small>

                </button>


                <button
                    class="menu-card"
                    onclick="showQuiz()"
                >

                    <span class="menu-icon">
                        📝
                    </span>

                    <strong>
                        Quizzes
                    </strong>

                    <small>
                        Test your knowledge
                    </small>

                </button>


                <button
                    class="menu-card"
                    onclick="showMaterials()"
                >

                    <span class="menu-icon">
                        📖
                    </span>

                    <strong>
                        Study Materials
                    </strong>

                    <small>
                        Notes and resources
                    </small>

                </button>


                <button
                    class="menu-card"
                    onclick="showProgress()"
                >

                    <span class="menu-icon">
                        🏆
                    </span>

                    <strong>
                        My Progress
                    </strong>

                    <small>
                        View your points
                    </small>

                </button>

            </div>


            <!-- MY POINTS -->

            <div class="home-points">

                <div class="info-card">

                    <h3>
                        ⭐ My Points
                    </h3>

                    <p>
                        Keep learning to earn more points!
                    </p>

                    <button
                        class="action-button"
                        onclick="showProgress()"
                    >
                        🏆 View My Progress
                    </button>

                </div>

            </div>

        </section>


        <!-- DYNAMIC CONTENT -->

        <section id="appContent"></section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 ACHIEVERS HUB
        </p>

        <p>
            Learn • Practise • Achieve
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="curriculum.js"></script>

    <script src="script.js"></script>

</body>

</html>
